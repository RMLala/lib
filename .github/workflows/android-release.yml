name: Liberté — builds Android

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'work/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche
        uses: actions/checkout@v4
      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund
      - name: Vérifier les tests
        run: node --test tests/*.test.cjs
      - name: Synchroniser Android
        run: npm run sync
      - name: Compiler Debug API 23 et API 29
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleApi23Debug assembleApi29Debug
      - name: Publier APK Debug API 23
        uses: actions/upload-artifact@v4
        with:
          name: liberte-debug-api23
          path: android/app/build/outputs/apk/api23/debug/app-api23-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publier APK Debug API 29
        uses: actions/upload-artifact@v4
        with:
          name: liberte-debug-api29
          path: android/app/build/outputs/apk/api29/debug/app-api29-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Préparer la clé Release commune
        if: github.event_name != 'pull_request'
        env:
          KEY_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEY_BASE64" || (echo 'Secret KEYSTORE_BASE64 absent' && exit 1)
          echo "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
          echo "ANDROID_RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/android-release.jks" >> "$GITHUB_ENV"
      - name: Compiler Release API 23 / API 29 signés
        if: github.event_name != 'pull_request'
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_RELEASE_STORE_PASSWORD" || (echo 'Secret ANDROID_RELEASE_STORE_PASSWORD absent' && exit 1)
          test -n "$ANDROID_RELEASE_KEY_ALIAS" || (echo 'Secret ANDROID_RELEASE_KEY_ALIAS absent' && exit 1)
          test -n "$ANDROID_RELEASE_KEY_PASSWORD" || (echo 'Secret ANDROID_RELEASE_KEY_PASSWORD absent' && exit 1)
          cd android
          chmod +x gradlew
          ./gradlew assembleApi23Release assembleApi29Release
      - name: Publier APK Release signée API 23
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: liberte-release-api23
          path: android/app/build/outputs/apk/api23/release/app-api23-release.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publier APK Release signée API 29
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: liberte-release-api29
          path: android/app/build/outputs/apk/api29/release/app-api29-release.apk
          if-no-files-found: error
          retention-days: 90
