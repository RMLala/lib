name: Liberté read-only D1 verification

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/liberte-d1-readonly.yml"

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'RMLala/lib'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read product and aggregate trial status from D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: a77521ea-dc78-4b80-b495-405127e275e7
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Cloudflare account secret is unavailable"; exit 2; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Cloudflare API token secret is unavailable"; exit 2; }
          npx --yes wrangler@4 d1 execute "$D1_DATABASE_ID" --remote --json --command "SELECT p.product_id, p.name, p.status, (SELECT COUNT(*) FROM trials t WHERE t.product_id=p.product_id) AS total_trials, (SELECT COUNT(*) FROM trials t WHERE t.product_id=p.product_id AND t.expires_at > CURRENT_TIMESTAMP) AS active_trials FROM products p WHERE p.product_id='LIBERTE';"
